<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>夜市成本利潤大作戰</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: night-market lantern string + piggy-bank mascot 豬寶, global group scoreboard, 4 candy tabs; colors follow textbook fig 5-1 (orange 會計成本, green 內含成本, pink 經濟利潤) */
:root{
  --bg:#fff4ec; --surface:#ffffff; --ink:#3a2233; --muted:#7d5e6e; --line:#f3d3df;
  --acc:#f59a3c; --imp:#86c94f; --eco:#f27aa8; --ec:#5aa8ee; --ap:#b48cf0; --tr:#ffc93f; --loss:#e0444d;
  --accT:#c45f0c; --impT:#3f8a17; --ecoT:#c92c6a; --ecT:#1f6fbd; --apT:#7a45cf;
  --pig:#ffb8cb; --pig2:#ff8fb0; --pigS:#d9638a; --gold:#ffc531; --goldS:#c98a00;
  --night:#3b2560; --good:#1f8a52; --bad:#d23b3b; --hi:#ff5f8f;
  --display:"Huninn","LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1426; --surface:#2a1f36; --ink:#fbeef5; --muted:#cbb2c6; --line:#47344f;
  --accT:#ffb15e; --impT:#a6e06e; --ecoT:#ff95bf; --ecT:#8cc6ff; --apT:#cdb0ff;
  --night:#120b1d; --good:#4cc485; --bad:#f07070; --hi:#ff7aa3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1426; --surface:#2a1f36; --ink:#fbeef5; --muted:#cbb2c6; --line:#47344f;
  --accT:#ffb15e; --impT:#a6e06e; --ecoT:#ff95bf; --ecT:#8cc6ff; --apT:#cdb0ff;
  --night:#120b1d; --good:#4cc485; --bad:#f07070; --hi:#ff7aa3; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:60px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{cursor:pointer;touch-action:manipulation}

/* lantern string */
.sky{position:relative;height:78px;margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  background:linear-gradient(var(--night),color-mix(in srgb,var(--night) 70%,var(--bg)));overflow:hidden}
.sky .wire{position:absolute;left:-2%;right:-2%;top:6px;height:40px;border-bottom:2px solid #f5d27a;border-radius:0 0 50% 50%/0 0 100% 100%}
.lanterns{position:absolute;inset:0;display:flex;justify-content:space-around;padding:0 2%}
.lan{width:34px;transform-origin:50% 0;animation:swing 3s ease-in-out infinite alternate}
.lan:nth-child(2n){animation-delay:-1.4s}.lan:nth-child(3n){animation-delay:-.7s}
@keyframes swing{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.star{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff6c8;animation:tw 2s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.2}}

header.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-top:-4px}
header.top nav.tabs{flex:1;justify-content:center}
.grpbtn[aria-pressed="true"]{background:var(--gold);color:#3a2233}
body.solo .board,body.solo .turn,body.solo .grp-only{display:none!important}
.brand{display:flex;align-items:center;gap:14px}
.brand svg{width:92px;height:92px;flex:none;animation:hop 2.4s ease-in-out infinite}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-10px) rotate(-4deg)}}
.top h1{font-family:var(--display);font-size:clamp(28px,5vw,46px);margin:0;line-height:1.15;font-weight:400;text-wrap:balance}
.top h1 span{color:var(--hi)}
.top p{margin:2px 0 0;color:var(--muted);font-size:15px}

/* scoreboard */
.board{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.team{position:relative;flex:1 1 150px;min-width:0;background:var(--surface);border:3px solid var(--line);border-radius:16px;padding:2px 10px;display:flex;align-items:center;gap:8px;cursor:pointer}
.team.on{border-color:var(--hi);box-shadow:0 4px 0 var(--hi)}
.team .nm{font-size:15px;color:var(--muted);display:flex;align-items:center;gap:6px}
.team .nm i{width:14px;height:14px;border-radius:50%;background:var(--tc)}
.team.on .nm{color:var(--ink);font-weight:700}
.team .crown{position:absolute;top:-12px;left:10px;background:var(--hi);color:#fff;font-size:13px;font-weight:700;border-radius:999px;padding:0 10px}
.team .pt{font-family:var(--display);font-size:26px;margin-left:auto;line-height:1.1;font-variant-numeric:tabular-nums}
.team.bump .pt{animation:bump .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{40%{transform:scale(1.5);color:var(--hi)}}
.team .adj{display:flex;gap:6px}
.team .adj button{width:34px;min-height:32px;padding:0;font-size:20px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.boardctl{display:flex;flex-direction:row;align-items:center;gap:6px;justify-content:center;font-size:15px;color:var(--muted)}
.boardctl select{font:inherit;padding:6px 8px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}

nav.tabs{display:flex;flex-wrap:wrap;gap:10px}
nav.tabs button{font-family:var(--display);font-size:21px;padding:9px 18px 9px 10px;border-radius:999px;border:3px solid var(--ink);background:var(--surface);color:var(--ink);display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s}
nav.tabs button b{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#3a2233;font-size:17px}
nav.tabs button[aria-selected="true"]{background:var(--hi);color:#fff;transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

.stage{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:3px solid var(--line);border-radius:24px;padding:18px 20px;min-width:0;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;line-height:1.25;text-wrap:balance}
h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.btn{font-family:var(--display);font-size:22px;padding:11px 22px;border-radius:18px;border:3px solid var(--ink);background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--hi);color:#fff}
.btn.small{font-size:17px;padding:6px 14px;border-radius:14px;box-shadow:0 3px 0 var(--ink)}
.btn.on{background:var(--gold);color:#3a2233}
.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,select:focus-visible{outline:4px solid var(--ec);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.note{font-size:15px;color:var(--muted);margin:0}
.ok{color:var(--good)} .no{color:var(--bad)}

.say{display:flex;gap:10px;align-items:flex-start}
.say>svg{width:76px;height:76px;flex:none}
.say>svg.bounce{animation:hop .7s ease-in-out 2}
.say>svg.shake{animation:no .45s ease-in-out 2}
@keyframes no{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.bubble{position:relative;flex:1;min-width:0;background:var(--bg);border:3px solid var(--line);border-radius:20px;padding:10px 16px;font-size:20px;line-height:1.55}
.bubble::before{content:"";position:absolute;left:-12px;top:22px;border:9px solid transparent;border-right-color:var(--line);border-left:0}
.bubble.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.85)}}
.bubble b{font-family:var(--display);font-weight:400;font-size:23px}

/* term colors */
.t-acc{color:var(--accT)} .t-imp{color:var(--impT)} .t-eco{color:var(--ecoT)} .t-ec{color:var(--ecT)} .t-ap{color:var(--apT)}
.chip{display:inline-block;border-radius:999px;padding:1px 12px;font-weight:700;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 18%,var(--surface));margin:2px 2px}

/* spy hall */
.hall{position:relative;border-radius:22px;padding:12px 12px 14px;background:linear-gradient(color-mix(in srgb,var(--night) 22%,var(--surface)),var(--surface) 70%);border:3px solid var(--line);overflow:hidden}
.queue{display:flex;gap:4px;align-items:flex-end;min-height:44px;flex-wrap:wrap}
.queue svg{width:30px;height:38px;opacity:.6}
.queue .more{font-size:15px;color:var(--muted);margin-left:6px}
.guestSpot{display:flex;justify-content:center;align-items:flex-end;min-height:270px}
.guest{position:relative;display:flex;flex-direction:column;align-items:center;transition:transform .9s cubic-bezier(.5,0,.4,1),opacity .9s}
.guest svg{width:150px;height:188px}
.guest .bob{animation:bob .9s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px)}}
.guest .talk{background:var(--surface);border:3px solid var(--ink);border-radius:18px;padding:6px 16px;font-size:20px;max-width:340px;text-align:center;position:relative;margin-bottom:8px;line-height:1.45}
.guest .talk::after{content:"";position:absolute;bottom:-11px;left:50%;margin-left:-8px;border:8px solid transparent;border-top-color:var(--ink);border-bottom:0}
.guest.walkin{animation:walkin .8s cubic-bezier(.3,1.3,.5,1)}
@keyframes walkin{from{transform:translateX(-70vw)}}
.doors{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:6px}
@media (max-width:560px){.doors{grid-template-columns:repeat(3,minmax(0,1fr))}}
.door{position:relative;border:0;padding:0;background:none;font:inherit;color:inherit;display:flex;flex-direction:column;align-items:center}
.door .sign{position:relative;z-index:1;max-width:100%;text-align:center;font-family:var(--display);font-size:clamp(15px,1.6vw,20px);background:var(--c);color:#2a1620;border:3px solid var(--ink);border-radius:12px;padding:1px 6px;line-height:1.25;box-shadow:0 3px 0 var(--ink)}
.door .frame{position:relative;width:100%;aspect-ratio:3/4;margin-top:-8px;background:#2b1d33;border:3px solid var(--ink);border-radius:50% 50% 8px 8px/26% 26% 8px 8px;perspective:600px;overflow:hidden;transition:transform .1s}
.door .pd{position:absolute;inset:8px 6px 0;background:var(--c);border:3px solid var(--ink);border-bottom:0;border-radius:50% 50% 0 0/26% 26% 0 0;transform-origin:left center;transition:transform .45s}
.door .pd::after{content:"";position:absolute;right:12%;top:55%;width:11px;height:11px;border-radius:50%;background:var(--gold);border:2px solid var(--ink)}
.door.open .pd{transform:rotateY(-78deg)}
.door:active .frame{transform:translateY(3px)}
.door.jail .pd{background:repeating-linear-gradient(90deg,#8a8494 0 7px,transparent 7px 22px),#4a4352}
.door.jail .pd::after{display:none}
.door.hint .frame{outline:6px solid var(--good);outline-offset:2px}
.door .n{position:absolute;top:22px;right:-4px;z-index:2;background:var(--surface);border:3px solid var(--ink);border-radius:999px;min-width:32px;font-size:16px;font-weight:700;text-align:center}
.door.bump .n{animation:bump .6s}
.door:disabled{cursor:default}
.prog{height:16px;border-radius:999px;background:var(--bg);border:2px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--hi));transition:width .5s}

.minipop{position:absolute;z-index:20;pointer-events:none;transform:translate(-50%,-100%);animation:minirise 1.1s ease-out forwards}
.minipop b{display:block;font-family:var(--display);font-weight:400;font-size:30px;color:var(--hi);-webkit-text-stroke:1px var(--surface)}
.minipop i{position:absolute;top:8px;left:50%;font-style:normal;font-size:20px;color:var(--hi);transform:translateX(var(--x))}
.minipop i.coin{width:24px;height:24px;font-size:12px;color:#8a5a00;top:12px}
@keyframes minirise{0%{opacity:0;transform:translate(-50%,-60%) scale(.6)}20%{opacity:1;transform:translate(-50%,-110%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
@media (prefers-reduced-motion:reduce){.minipop{animation:none;opacity:0}}

/* piggy bank settlement */
.bank{position:relative;min-height:470px;border-radius:20px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) minmax(0,1fr);gap:8px;padding:12px 10px 44px;
  background:radial-gradient(circle at 15% 12%,#fff6c8 0 2px,transparent 3px),radial-gradient(circle at 70% 8%,#fff6c8 0 2px,transparent 3px),radial-gradient(circle at 90% 26%,#fff6c8 0 2px,transparent 3px),linear-gradient(var(--night),color-mix(in srgb,var(--night) 35%,var(--surface)))}
.bank .stampBig{position:static;transform:rotate(-6deg);margin-bottom:10px;font-size:clamp(17px,2.2vw,24px);white-space:normal;text-align:center;animation:pop .5s cubic-bezier(.3,1.8,.5,1)}
.bank .floor{position:absolute;left:0;right:0;bottom:0;height:34px;background:repeating-linear-gradient(90deg,#c98a4a 0 30px,#b8773a 30px 60px);border-top:3px solid #7a4a12}
.bank .col{display:flex;flex-direction:column;gap:8px;z-index:1;min-width:0}
.bank .col h4{margin:0 0 2px;font-family:var(--display);font-weight:400;font-size:clamp(14px,1.6vw,17px);color:#fff;text-align:center;line-height:1.3}
.bill{position:relative;border:3px solid var(--ink);border-radius:12px;background:var(--c);color:#2a1620;font:inherit;font-weight:700;font-size:clamp(13px,1.4vw,15px);padding:5px 6px;text-align:center;box-shadow:0 3px 0 var(--ink);line-height:1.25;cursor:default}
.bill small{display:block;font-family:var(--display);font-weight:400;font-size:clamp(15px,1.8vw,19px)}
.bill.new{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
.bill.go{cursor:pointer;animation:glow 1.1s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 3px 0 var(--ink),0 0 0 0 rgba(255,255,255,.0)}to{box-shadow:0 3px 0 var(--ink),0 0 0 6px rgba(255,255,255,.75)}}
.bill.paid{opacity:.72;box-shadow:none}
.bill.paid::after{content:"已付";position:absolute;top:-10px;right:-6px;transform:rotate(12deg);font-family:var(--display);font-weight:400;font-size:14px;line-height:1.3;color:var(--loss);border:2px solid var(--loss);border-radius:6px;padding:0 5px;background:#fff}
.bank .mid{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;z-index:1;min-width:0}
.money{font-family:var(--display);font-size:clamp(16px,2vw,24px);color:#fff;background:rgba(0,0,0,.38);border-radius:14px;padding:2px 12px;margin-bottom:6px;font-variant-numeric:tabular-nums;max-width:100%;text-align:center}
.money.neg{color:#ffb3b8}
.bigpig{width:min(100%,210px);aspect-ratio:1;transition:transform .8s cubic-bezier(.3,1.5,.5,1);transform-origin:50% 92%}
.fcoin{position:absolute;width:26px;height:26px;font-size:12px;z-index:5;pointer-events:none;transition:transform .75s cubic-bezier(.45,0,.4,1),opacity .3s .55s}
.iou{background:#fff;color:var(--loss);border:3px dashed var(--loss);border-radius:8px;padding:2px 10px;font-weight:700;font-size:16px;transform:rotate(-4deg);animation:pop .5s cubic-bezier(.3,1.8,.5,1);margin-top:4px;white-space:nowrap}
.blk{position:relative;border:3px solid var(--ink);border-radius:12px;background:var(--c);color:#2a1620;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px;line-height:1.15;overflow:hidden;padding:0 6px;text-align:center}
.blk::before{content:"";position:absolute;inset:3px 3px auto 3px;height:30%;border-radius:8px;background:rgba(255,255,255,.28)}
.kao{position:relative;width:26px;height:16px;flex:none}
.kao::before{content:"";position:absolute;left:3px;top:2px;width:5px;height:5px;border-radius:50%;background:#2a1620;box-shadow:14px 0 0 #2a1620}
.kao::after{content:"";position:absolute;left:8px;top:7px;width:8px;height:4px;border:2.5px solid #2a1620;border-top:0;border-radius:0 0 9px 9px}
.stampBig{position:absolute;top:18px;left:50%;z-index:6;font-family:var(--display);font-size:clamp(24px,3vw,32px);border:5px solid var(--c);color:var(--c);background:var(--surface);border-radius:16px;padding:0 16px;transform:translateX(-50%) rotate(-6deg);animation:stampin .5s cubic-bezier(.3,1.8,.5,1);white-space:nowrap}
@keyframes stampin{from{transform:translateX(-50%) rotate(-6deg) scale(2.2);opacity:0}}
.box{display:flex;flex-wrap:wrap;gap:12px}
.box .blk{font-family:var(--body);font-size:18px;padding:10px 14px 10px 10px;min-height:64px;margin:0;background:#fff1d6;box-shadow:0 4px 0 var(--ink);transition:transform .15s;max-width:100%}
.box .blk small{display:block;font-size:20px;font-family:var(--display);font-weight:400}
.box .blk.sel{outline:5px solid var(--hi);outline-offset:2px;transform:translateY(-6px) rotate(-2deg)}
.box .blk.nope{animation:no .45s ease-in-out 2}
.zbtn{flex:1 1 200px;font-family:var(--display);font-size:24px;padding:12px 14px;border-radius:18px;border:4px solid var(--ink);background:var(--c);color:#2a1620;box-shadow:0 5px 0 var(--ink)}
.zbtn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.zbtn:disabled{opacity:.45;cursor:not-allowed}
.zbtn small{display:block;font-family:var(--body);font-size:14px;font-weight:700}
.trbig{font-family:var(--display);font-size:24px}

.fam{display:flex;flex-direction:column;gap:10px}
.fam>div{border-left:10px solid var(--c);background:var(--bg);border-radius:14px;padding:8px 12px}
.fam .hd{font-family:var(--display);font-size:22px}
.fam .def{font-size:15px;color:var(--muted)}
.rules{margin:0;padding-left:1.3em;font-size:17px}
.rules li{margin:2px 0}

/* sort game: receipt + two-page ledger (visible ink vs invisible ink) */
.scene{position:relative;display:flex;flex-direction:column;gap:18px;align-items:center;padding-top:12px}
.scard{position:relative;width:min(560px,100%);background:#fffdf6;color:#3a2233;border:3px solid var(--ink);border-bottom:0;border-radius:14px 14px 0 0;padding:20px 24px 26px;text-align:center;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 12px) no-repeat,radial-gradient(circle 9px at 50% 100%,transparent 9px,#000 9.5px) bottom/22px 12px repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 12px) no-repeat,radial-gradient(circle 9px at 50% 100%,transparent 9px,#000 9.5px) bottom/22px 12px repeat-x}
.scard .num{display:inline-block;background:var(--gold);color:#3a2233;font-weight:700;border-radius:999px;padding:0 14px;font-size:15px;border:2px solid #3a2233}
.scard .who{font-size:16px;color:#7d5e6e;letter-spacing:.1em;border-bottom:2px dashed #d9c8cf;padding-bottom:4px;margin:6px 0 8px}
.scard .txt{font-family:var(--display);font-size:clamp(23px,3vw,31px);line-height:1.45}
.scard .stamp{position:absolute;top:10px;right:12px;font-family:var(--display);font-size:20px;color:var(--c);border:3px solid var(--c);border-radius:10px;padding:0 10px;transform:rotate(10deg);animation:stampin2 .4s cubic-bezier(.3,1.8,.5,1);background:#fffdf6}
@keyframes stampin2{from{transform:rotate(10deg) scale(2.4);opacity:0}}
.scard.enter{animation:print .6s ease-out}
@keyframes print{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.book{position:relative;display:grid;grid-template-columns:1fr 1fr;width:100%;border:4px solid var(--ink);border-radius:16px;box-shadow:0 7px 0 var(--ink);overflow:hidden;background:var(--ink)}
.book::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:22px;margin-left:-11px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.28),transparent);pointer-events:none}
.page{position:relative;border:0;margin:0;font:inherit;color:#3a2233;text-align:left;min-height:280px;padding:12px 14px 14px 30px;display:flex;flex-direction:column;gap:2px;
  background:linear-gradient(90deg,transparent 22px,#f2a3a3 22px 24px,transparent 24px),repeating-linear-gradient(#fffdf3 0 29px,#cfe1f5 29px 31px)}
.page.R{background:linear-gradient(90deg,transparent 22px,#c9a9f2 22px 24px,transparent 24px),repeating-linear-gradient(#fbf7ff 0 29px,#e1d6f3 29px 31px)}
.page h3{font-size:clamp(19px,2.2vw,24px);line-height:1.2;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.page .al{font-size:14px;font-weight:700;color:#7d5e6e;margin-bottom:4px}
.page .cnt{margin-left:auto;font-family:var(--body);font-size:15px;background:#3a2233;color:#fff;border-radius:999px;padding:0 10px}
.page:active:not(:disabled){filter:brightness(.96)}
.page:disabled{cursor:default}
.page ul{list-style:none;margin:0;padding:0;font-family:var(--display);font-size:20px;line-height:31px;max-height:248px;overflow:auto}
.page li{white-space:nowrap}
.page li.write{animation:write .8s steps(10) both}
@keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.page.L li{color:#1d3f8a}
.page.R li{color:#8a3fe0;transition:opacity 1.2s,text-shadow 1.2s}
.page.R li.hide{opacity:.08}
.page.nope{animation:no .4s ease-in-out 2}
.pen{position:absolute;width:44px;height:44px;pointer-events:none;z-index:3;animation:penmove .8s ease-in-out both}
@keyframes penmove{0%{transform:translate(0,0) rotate(-10deg)}25%{transform:translate(20px,-4px) rotate(-4deg)}50%{transform:translate(45px,2px) rotate(-12deg)}75%{transform:translate(70px,-4px) rotate(-4deg)}100%{transform:translate(95px,0) rotate(-10deg);opacity:0}}
.book.uv .page.R{background:radial-gradient(circle at 50% 45%,#5b2a9a,#22103d 75%);color:#fff}
.book.uv .page.R li{opacity:1;color:#f3e6ff;text-shadow:0 0 8px #d29bff,0 0 16px #b06bff}
.book.uv .page.R .al{color:#e0c9ff}
.uvbtn.on{background:#5b2a9a;color:#fff}

/* stacked bar */
svg.barsvg{width:100%;height:auto;display:block;font-family:var(--body);overflow:visible}
svg.barsvg text{fill:var(--ink)}
svg.barsvg .segT{fill:#2a1620;font-weight:700}
svg.barsvg .disp{font-family:var(--display)}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow .7s cubic-bezier(.3,1.2,.5,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.fade{animation:fadein .5s ease-out both}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
.scen{background:var(--bg);border-radius:18px;padding:12px 16px;border:3px dashed var(--line)}
.scen ul{margin:6px 0 0;padding-left:1.2em;font-size:20px}
.scen .tr{font-family:var(--display);font-size:24px}
.calc{display:flex;flex-direction:column;gap:4px;font-size:18px}
.calc div{padding:2px 10px;border-radius:10px}
.calc div.hit{background:color-mix(in srgb,var(--gold) 35%,transparent);font-weight:700}

/* quiz */
.qtext{font-family:var(--display);font-size:clamp(23px,2.8vw,29px);line-height:1.45}
.qtext b{font-weight:400}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.opt{font-family:var(--display);font-size:23px;padding:14px 16px;border-radius:18px;border:3px solid var(--line);background:var(--bg);color:var(--ink);text-align:left;box-shadow:0 4px 0 var(--line)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--surface));box-shadow:0 4px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface));box-shadow:0 4px 0 var(--bad)}
.opt:disabled{cursor:default}
.turn{font-size:17px;color:var(--muted)} .turn b{color:var(--ink);font-size:24px;font-family:var(--display);font-weight:400}
.explain{background:var(--bg);border-radius:18px;padding:12px 16px;font-size:19px;border:3px solid var(--line)}
.tblwrap{overflow-x:auto}
table.dt{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:21px}
table.dt th,table.dt td{border:2px solid var(--line);padding:6px 6px;text-align:center}
table.dt th{width:45%;font-family:var(--display);font-weight:400;font-size:21px;background:color-mix(in srgb,var(--c) 30%,var(--surface))}
table.dt td.q{background:color-mix(in srgb,var(--gold) 40%,var(--surface));font-family:var(--display);font-size:26px}
table.dt td.giv{font-weight:700}
table.dt td.rev{color:var(--muted)}
.pi3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.pi3>div{border-radius:14px;padding:8px;border:3px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.pi3 b{font-family:var(--display);font-weight:400;font-size:24px;display:block}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.confetti>*{position:absolute;top:-60px;width:46px;height:46px;animation:fall 1.7s ease-in forwards}
.coin{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gold) 45%,var(--goldS));border:3px solid var(--goldS);display:grid;place-items:center;font-family:var(--display);color:#8a5a00;font-size:20px}
@keyframes fall{to{transform:translateY(112vh) rotate(600deg)}}
/* one-screen layout on tablet / projector: nothing scrolls except, rarely, inside a panel */
@media (min-width:900px) and (min-height:560px){
  body{height:100vh;height:100dvh;overflow:hidden;padding-bottom:0;font-size:17px}
  .wrap{height:calc(100vh - 30px);height:calc(100dvh - 30px);gap:8px;padding-bottom:10px}
  .sky{height:30px;flex:none}
  .lan svg{width:20px;height:42px}
  header.top{flex:none;margin-top:4px}
  .brand svg{width:50px;height:50px}
  .top h1{font-size:26px}
  .top p{font-size:13px;margin:0}
  nav.tabs{gap:8px}
  nav.tabs button{font-size:18px;padding:5px 14px 5px 6px;box-shadow:0 3px 0 var(--ink)}
  nav.tabs button b{width:26px;height:26px;font-size:15px}
  .board{flex:none}
  section[role=tabpanel]{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
  section[role=tabpanel] .stage{flex:1;min-height:0;gap:12px;align-items:stretch}
  .stage>.panel{min-height:0;overflow:auto;padding:12px 16px;gap:10px}
  h2{font-size:24px}
  .say>svg{width:58px;height:58px}
  .bubble{font-size:18px;padding:8px 14px}
  .bubble b{font-size:20px}
  .btn{font-size:19px;padding:7px 18px}
  .rules{font-size:15px}
  .guestSpot{min-height:0}
  .guest svg{width:112px;height:140px}
  .guest .talk{font-size:17px;padding:4px 12px;margin-bottom:4px}
  .hall{padding:8px 10px 10px}
  .queue{min-height:34px}
  .queue svg{width:24px;height:30px}
  .door .frame{aspect-ratio:1/1}
  .scene{gap:12px;padding-top:4px}
  .scard{padding:12px 18px 20px}
  .scard .txt{font-size:24px}
  .page{min-height:250px}
  .page ul{max-height:200px;font-size:18px}
  .bank{min-height:0;height:100%}
  .bigpig{width:min(100%,180px)}
  .box{gap:8px}
  .box .blk{min-height:52px;font-size:16px;padding:6px 10px 6px 8px}
  .box .blk small{font-size:17px}
  .zbtn{font-size:20px;padding:8px 10px}
  .trbig{font-size:20px}
  .qtext{font-size:23px}
  .opt{font-size:19px;padding:9px 14px}
  .explain,.calc{font-size:16px}
  table.dt,table.dt th{font-size:17px}
  table.dt th,table.dt td{padding:3px 6px}
  table.dt td.q{font-size:21px}
  #qKind{margin-bottom:0!important;flex:none}
  #bar .stage>.panel:last-child{overflow:hidden}
  #qSide .barsvg{max-height:150px}
  #qSide .note{font-size:13px}
  #qSide h3{font-size:19px}
  table.dt th,table.dt td{padding:2px 6px}
  .fam{gap:6px}
  .fam>div{padding:3px 10px;border-left-width:8px}
  .fam .hd{font-size:18px;line-height:1.3}
  .fam .chip{font-size:14px;padding:0 8px;margin:1px}
  .fam .def{font-size:13px;line-height:1.4}
}
@media (min-width:900px) and (max-height:720px){
  .page{min-height:160px}
  .page ul{max-height:120px}
  .scard .txt{font-size:21px}
  .box .blk{min-height:44px;font-size:15px}
  .qtext{font-size:21px}
  .bubble{font-size:16px}
  .bubble b{font-size:18px}
  .say>svg{width:48px;height:48px}
}
@media (prefers-reduced-motion:reduce){.brand svg,.lan,.star,.say>svg,.bubble.pop,.confetti>*,.grow,.fade,.fc .in,.scard,.team.bump .pt{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><div class="wire"></div><div class="lanterns" id="lanterns"></div></div>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="pig" id="pigTop" aria-hidden="true"></svg>
      <div>
        <h1>夜市小老闆<span>成本利潤大作戰</span></h1>
        <p>經濟學 5-1 成本與利潤</p>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="alias"><b>1</b>抓間諜</button>
      <button role="tab" data-tab="sort"><b>2</b>成本丟丟樂</button>
      <button role="tab" data-tab="bar"><b>3</b>豬寶收攤結算</button>
      <button role="tab" data-tab="quiz"><b>4</b>π 判官搶答</button>
    </nav>
    <button class="btn small grpbtn" id="grpToggle" aria-pressed="false">👥 分組計分</button>
  </header>

  <div class="board" id="board" aria-label="分組計分板"></div>

  <!-- 1 spy hall -->
  <section id="alias" role="tabpanel">
    <div class="stage">
      <div class="panel">
        <div class="row" style="justify-content:space-between"><h2>家族會館：今天混進了間諜！</h2><span class="turn">輪到 <b id="agTeam"></b></span></div>
        <div class="hall">
          <div class="queue" id="spQueue" aria-label="排隊中的客人"></div>
          <div class="guestSpot"><div class="guest" id="spGuest"></div></div>
          <div class="doors" id="spDoors"></div>
        </div>
        <div class="row"><button class="btn primary" id="spNext" hidden>下一位客人<span class="grp-only">（換下一組）</span>▶</button><span class="note" id="spCount"></span></div>
        <div class="prog" aria-hidden="true"><i id="spBar" style="width:0"></i></div>
      </div>
      <div class="panel">
        <div class="say"><svg class="pig" id="agPig" aria-hidden="true"></svg><div class="bubble" id="agMsg" aria-live="polite"></div></div>
        <ol class="rules">
          <li>客人一個一個上門，<b>看他的名牌</b>，按下他真正的家門。</li>
          <li>名牌上的名字不是任何家族的別稱？那就是<b>間諜</b>，按「間諜牢房」！</li>
          <li class="grp-only">答對 +1 分，每位客人換一組回答。</li>
        </ol>
        <div class="row"><button class="btn" id="agNew">新的一天（重來）</button><button class="btn" id="agPeek">看家族表</button></div>
        <div id="agFam" hidden></div>
      </div>
    </div>
  </section>

  <!-- 2 sort -->
  <section id="sort" role="tabpanel" hidden>
    <div class="stage">
      <div class="panel">
        <div class="row" style="justify-content:space-between"><h2>這筆帳要怎麼記？</h2><span class="turn">輪到 <b id="sgTeam"></b></span></div>
        <div class="scene">
          <div class="scard" id="sgCard"></div>
          <div class="book" id="sgBook">
            <button class="page L" id="bAcc"><h3 class="t-acc">寫進帳本 <span class="cnt" id="cAcc">0</span></h3><span class="al">會計成本・外顯成本・支付成本</span><ul id="lAcc"></ul></button>
            <button class="page R" id="bImp"><h3 class="t-imp">用隱形墨水寫 <span class="cnt" id="cImp">0</span></h3><span class="al">內含成本・隱藏成本・非支付成本</span><ul id="lImp"></ul></button>
          </div>
          <div class="row"><button class="btn primary" id="sgNext" hidden>下一張收據<span class="grp-only">（換下一組）</span>▶</button></div>
        </div>
      </div>
      <div class="panel">
        <div class="say"><svg class="pig" id="sgPig" aria-hidden="true"></svg><div class="bubble" id="sgMsg" aria-live="polite"></div></div>
        <button class="btn uvbtn" id="sgUV">🔦 經濟學家的手電筒</button>
        <p class="note">會計師只看得到左頁；經濟學家用手電筒一照，右頁的隱形墨水也會發光，兩頁加起來才是<b class="t-ec">經濟成本</b>。</p>
        <p class="note">口訣：<b class="t-acc">付給別人、帳上看得到</b> → 會計成本；<b class="t-imp">用自己的、放棄的機會</b> → 內含成本。</p>
        <div class="row"><button class="btn small" id="sgReset">重新發牌</button><span class="note" id="sgLeft"></span></div>
      </div>
    </div>
  </section>

  <!-- 3 piggy bank -->
  <section id="bar" role="tabpanel" hidden>
    <div class="stage">
      <div class="panel">
        <div class="row" style="justify-content:space-between"><h2 id="bgTitle"></h2><span class="turn">輪到 <b id="bgTeam"></b></span></div>
        <div class="say"><svg class="pig" id="bgPig" aria-hidden="true"></svg><div class="bubble" id="bgMsg" aria-live="polite"></div></div>
        <div id="bgStep" style="display:flex;flex-direction:column;gap:14px"></div>
        <div class="calc" id="bgCalc"></div>
        <div class="row"><button class="btn primary" id="bgNext" hidden>下一步<span class="grp-only">（換下一組）</span>▶</button><button class="btn small" id="bgSkip">換一個攤位</button></div>
      </div>
      <div class="panel">
        <div class="bank" id="bank"></div>
      </div>
    </div>
  </section>

  <!-- 4 quiz -->
  <section id="quiz" role="tabpanel" hidden>
    <div class="row" id="qKind" style="margin-bottom:14px">
      <button class="btn small on" data-k="mix">綜合</button>
      <button class="btn small" data-k="alias">別稱</button>
      <button class="btn small" data-k="judge">π 判官</button>
      <button class="btn small" data-k="table">填表</button>
      <button class="btn small" data-k="concept">觀念</button>
    </div>
    <div class="stage">
      <div class="panel">
        <div class="row" style="justify-content:space-between"><span class="turn">輪到 <b id="qTeam"></b></span><span class="note" id="qTag"></span></div>
        <div class="qtext" id="qText"></div>
        <div class="opts" id="qOpts"></div>
        <div id="qExWrap" hidden class="say"><svg class="pig" id="qPig" aria-hidden="true"></svg><div class="bubble" id="qEx"></div></div>
        <div class="row"><button class="btn primary" id="qNext">下一題<span class="grp-only">（換下一組）</span>▶</button><button class="btn small" id="qSkip">換一題</button></div>
      </div>
      <div class="panel" id="qSide"></div>
    </div>
  </section>
</div>

<script>
(function(){
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const NS="http://www.w3.org/2000/svg";
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>(n<0?"−":"")+Math.abs(n).toLocaleString("en-US");
const fmtP=n=>n<0?"("+fmt(n)+")":fmt(n);
const reduced=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
function el(tag,attrs,parent,text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e}

/* ---------- mascot 豬寶 ---------- */
function pig(svg,mood){
  mood=mood||"ok";
  svg.setAttribute("viewBox","0 0 100 100");
  const eyes=mood==="happy"?'<path d="M31 52q5-7 10 0M59 52q5-7 10 0" stroke="#3a1a28" stroke-width="3.4" fill="none" stroke-linecap="round"/>'
    :mood==="sad"?'<path d="M30 45l10 4M70 45l-10 4" stroke="#3a1a28" stroke-width="2.6" stroke-linecap="round"/><circle cx="36" cy="54" r="3.6" fill="#3a1a28"/><circle cx="64" cy="54" r="3.6" fill="#3a1a28"/><path d="M33 60q-3 7 0 9q3-2 0-9z" fill="#6fc3ff"/>'
    :'<circle cx="36" cy="52" r="4.2" fill="#3a1a28"/><circle cx="64" cy="52" r="4.2" fill="#3a1a28"/><circle cx="37.4" cy="50.6" r="1.4" fill="#fff"/><circle cx="65.4" cy="50.6" r="1.4" fill="#fff"/>';
  const mouth=mood==="happy"?'<path d="M42 79q8 10 16 0z" fill="#b8325c"/>'
    :mood==="sad"?'<path d="M43 83q7-6 14 0" stroke="#3a1a28" stroke-width="2.6" fill="none" stroke-linecap="round"/>'
    :mood==="think"?'<path d="M45 81h10" stroke="#3a1a28" stroke-width="2.6" stroke-linecap="round"/>'
    :'<path d="M44 79q6 5 12 0" stroke="#3a1a28" stroke-width="2.6" fill="none" stroke-linecap="round"/>';
  const extra=mood==="think"?'<text x="86" y="26" font-size="24" font-family="Huninn,sans-serif" fill="var(--hi)">?</text>'
    :mood==="happy"?'<circle cx="88" cy="22" r="9" fill="var(--gold)" stroke="var(--goldS)" stroke-width="2"/><text x="88" y="27" font-size="11" text-anchor="middle" fill="#8a5a00">元</text>':"";
  svg.innerHTML=`<rect x="27" y="80" width="11" height="14" rx="4" fill="var(--pig2)" stroke="var(--pigS)" stroke-width="2"/><rect x="62" y="80" width="11" height="14" rx="4" fill="var(--pig2)" stroke="var(--pigS)" stroke-width="2"/>
  <path d="M86 60q10-2 6-9q-5-3-4 4" stroke="var(--pigS)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M22 36L17 13L42 27Z" fill="var(--pig2)" stroke="var(--pigS)" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M78 36L83 13L58 27Z" fill="var(--pig2)" stroke="var(--pigS)" stroke-width="2.4" stroke-linejoin="round"/>
  <ellipse cx="50" cy="58" rx="38" ry="31" fill="var(--pig)" stroke="var(--pigS)" stroke-width="2.6"/>
  <rect x="41" y="29" width="18" height="4.5" rx="2.2" fill="#7a2346"/>
  <circle cx="26" cy="66" r="6" fill="var(--hi)" opacity=".35"/><circle cx="74" cy="66" r="6" fill="var(--hi)" opacity=".35"/>
  <ellipse cx="50" cy="68" rx="13" ry="9" fill="var(--pig2)" stroke="var(--pigS)" stroke-width="2"/>
  <ellipse cx="45.5" cy="68" rx="2.4" ry="3.4" fill="#7a2346"/><ellipse cx="54.5" cy="68" rx="2.4" ry="3.4" fill="#7a2346"/>
  ${eyes}${mouth}${extra}`;
}
function react(svg,ok){pig(svg,ok?"happy":"sad");svg.classList.remove("bounce","shake");void svg.getBoundingClientRect();svg.classList.add(ok?"bounce":"shake")}
function say(box,html){box.innerHTML=html;box.classList.remove("pop");void box.offsetWidth;box.classList.add("pop")}
/* lanterns + stars */
(function(){
  const L=$("#lanterns"),cols=["#e8423f","#ff8a3d","#e8423f","#ffc531","#e8423f","#ff6f91"];
  const n=Math.max(6,Math.min(14,Math.round(innerWidth/95)));
  for(let i=0;i<n;i++){const c=cols[i%cols.length];const d=document.createElement("div");d.className="lan";

/* ---------- money model ---------- */
const KEYS=["tr","acc","imp","ec","ap","ep","np"];
const NAME={tr:"總收益",acc:"會計成本",imp:"內含成本",ec:"經濟成本",ap:"會計利潤",ep:"經濟利潤",np:"正常利潤"};
const KCOL={tr:"var(--tr)",acc:"var(--acc)",imp:"var(--imp)",ec:"var(--ec)",ap:"var(--ap)",ep:"var(--eco)",np:"var(--imp)"};
const KCLS={tr:"",acc:"t-acc",imp:"t-imp",ec:"t-ec",ap:"t-ap",ep:"t-eco",np:"t-imp"};
function model(tr,acc,imp){return {tr,acc,imp,np:imp,ec:acc+imp,ap:tr-acc,ep:tr-acc-imp}}
function signPi(){const r=Math.random();return r<.5?1:r<.72?0:-1}
function piFor(s,imp,step){return s>0?rnd(2,25)*step:s===0?0:-rnd(1,Math.max(1,Math.floor(imp*.6/step)))*step}
function piVerdict(ep){return ep>0?'π > 0，廠商有<b class="t-eco">超額利潤</b>':ep<0?'π < 0，廠商有<b class="no">經濟損失</b>':'π ＝ 0，廠商只有<b class="t-imp">正常利潤</b>'}
function numOpts(right,cands){
  const set=[right];shuffle(cands).forEach(c=>{if(set.length<4&&c!==right&&!set.includes(c))set.push(c)});
  let k=1;while(set.length<4){const c=right+(k%2?1:-1)*Math.ceil(k/2)*1000;if(!set.includes(c))set.push(c);k++}
  return shuffle(set);
}

    const t=el("text",Object.assign({x:small?Math.min(cx,X0+W):cx,y:ty,"text-anchor":small&&cx>X0+W-60?"end":"middle","font-size":small?16:mini?15:19,"font-weight":700},look),svg,nm);

  });
  if(v.ep<0){

    if(anim){r.classList.add("fade");t.classList.add("fade");r.style.animationDelay=t.style.animationDelay="1.1s"}
  }

    el("text",{x:m,y:dir>0?y-16:y+32,"text-anchor":"middle",class:"disp","font-size":21,fill:color},gg,label);
    if(anim){gg.classList.add("fade");gg.style.animationDelay=delay+"s"}

const ALL_TERMS=FAM.flatMap(f=>f.terms);
function qAlias(){
  const f=pick(FAM),t=pick(f.terms),mates=f.terms.filter(x=>x!==t),others=ALL_TERMS.filter(x=>!f.terms.includes(x));
  const ex=`<b class="${f.cls}">${f.head}家族</b>：${f.terms.join(" ＝ ")}。<br>${f.def}`;
  if(f.terms.length<3||Math.random()<.6){const right=pick(mates),opts=shuffle([right].concat(shuffle(others).slice(0,3)));
    return {kind:"alias",tag:"別稱",text:`「<b class="${f.cls}">${t}</b>」又稱（或等於）下列何者？`,opts,ans:opts.indexOf(right),ex,fam:f}}
  const wrong=pick(others),opts=shuffle(mates.concat([wrong]));
  return {kind:"alias",tag:"別稱",text:`下列何者 <b class="no">不是</b>「<b class="${f.cls}">${t}</b>」的別稱？`,opts,ans:opts.indexOf(wrong),ex:`「${wrong}」屬於 ${famOf(wrong).head}家族。`+"<br>"+ex,fam:f};
}
function qJudge(){
  const s=[1,0,-1][rnd(0,2)],acc=rnd(20,80)*1000,imp=rnd(8,40)*1000,ep=piFor(s,imp,1000),v=model(acc+imp+ep,acc,imp);
  const who=pick(WHO),stall=pick(STALL),form=rnd(0,2);
  let text;
  if(form===0)text=`${who}的${stall}本月總收益 ${fmt(v.tr)} 元，會計成本 ${fmt(v.acc)} 元，內含成本 ${fmt(v.imp)} 元。請判斷：`;
  else if(form===1)text=`${who}的${stall}本月會計利潤 ${fmt(v.ap)} 元，正常利潤 ${fmt(v.np)} 元。請判斷：`;
  else text=`${who}說：「我的${stall}扣掉付出去的錢，這個月賺了 ${fmt(v.ap)} 元。」但${who}為了擺攤，辭掉了月薪 ${fmt(v.imp)} 元的工作。請判斷：`;
  const opts=["π > 0：超額利潤","π ＝ 0：只有正常利潤","π < 0：經濟損失"];
  const calc=form===0?`π ＝ 總收益 − 會計成本 − 內含成本 ＝ ${fmt(v.tr)} − ${fmt(v.acc)} − ${fmt(v.imp)} ＝ ${fmt(v.ep)}`
    :`π ＝ 會計利潤 − 正常利潤 ＝ ${fmt(v.ap)} − ${fmt(v.np)} ＝ ${fmt(v.ep)}`+(form===2?"（放棄的月薪＝內含成本＝正常利潤）":"");
  return {kind:"judge",tag:"π 判官",text,opts,ans:s>0?0:s===0?1:2,ex:calc+"<br>"+piVerdict(v.ep)+(v.ep<0?"：會計上有賺，但不夠彌補自有要素的機會成本！":""),v};
}
const FORM=[
  ["tr",["acc","ap"],[1,1]],["tr",["ec","ep"],[1,1]],
  ["acc",["tr","ap"],[1,-1]],["acc",["ec","imp"],[1,-1]],["acc",["ec","np"],[1,-1]],
  ["imp",["np"],[1]],["np",["imp"],[1]],["imp",["ap","ep"],[1,-1]],["np",["ap","ep"],[1,-1]],["imp",["ec","acc"],[1,-1]],["np",["ec","acc"],[1,-1]],
  ["ec",["acc","imp"],[1,1]],["ec",["acc","np"],[1,1]],["ec",["tr","ep"],[1,-1]],
  ["ap",["tr","acc"],[1,-1]],["ap",["ep","np"],[1,1]],["ap",["ep","imp"],[1,1]],
  ["ep",["tr","ec"],[1,-1]],["ep",["ap","np"],[1,-1]],["ep",["ap","imp"],[1,-1]]
];
const GIVEN=[["tr","acc","imp"],["tr","acc","ec"],["tr","ec","ap"],["tr","ap","np"],["acc","ap","ep"],["tr","ep","np"],["ec","ep","ap"],["acc","ap","np"]];
function solve(v,given,target){
  const known=new Set(given),steps=[];let guard=0;
  while(!known.has(target)&&guard++<10){
    let f=FORM.find(([k,ins])=>k===target&&ins.every(x=>known.has(x)));
    if(!f)f=FORM.find(([k,ins])=>!known.has(k)&&ins.every(x=>known.has(x)));
    if(!f)break;known.add(f[0]);
    const [k,ins,sg]=f;
    steps.push(`<span class="${KCLS[k]}">${NAME[k]}</span> ＝ ${ins.map((x,i)=>(i?(sg[i]>0?" ＋ ":" − "):"")+NAME[x]).join("")} ＝ ${ins.map((x,i)=>(i?(sg[i]>0?" ＋ ":" − "):"")+fmtP(v[x])).join("")} ＝ <b>${fmt(v[k])}</b>`);
  }
  return steps;
}
function qTable(){
  const acc=rnd(30,70)*1000,imp=rnd(10,30)*1000,ep=piFor(signPi(),imp,1000),v=model(acc+imp+ep,acc,imp);
  const given=pick(GIVEN),left=KEYS.filter(k=>!given.includes(k));
  const target=pick(left);
  const cands=KEYS.filter(k=>k!==target).map(k=>v[k]).concat([v[target]+v.imp,v[target]-v.imp,-v[target]]);
  const opts=numOpts(v[target],cands);
  return {kind:"table",tag:"填表",text:`${pick(["蟹堡王餐廳","豬寶夜市攤","小新烤地瓜攤","妮妮鬆餅攤"])}的成本與利潤表缺了幾格，請算出 <b class="${KCLS[target]}">${NAME[target]}</b>（黃色格）是多少元？`,
    opts:opts.map(n=>fmt(n)+" 元"),ans:opts.indexOf(v[target]),v,given,target,ex:solve(v,given,target).join("<br>")};
}
function qConcept(){const [t,o,a,ex]=pick(CONCEPT);return {kind:"concept",tag:"觀念",text:t,opts:o,ans:a,ex}}
