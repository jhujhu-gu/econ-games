<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>披薩店產量實驗室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: one iPad-landscape screen — gingham strip, header row (mascot + title + tabs), then one view filling the rest (chart panel left, controls right) */
:root{
  --bg:#fff5d6; --surface:#ffffff; --ink:#3b2417; --muted:#7a5c48; --line:#f0dcb0;
  --tp:#2f8f4e; --mp:#e2452f; --ap:#2f6fd0; --cheese:#ffc83d; --crust:#e09a44; --sauce:#d9442f;
  --wall:#dff3ec; --tile:#c5e6da; --floor:#f3d9a8; --counter:#b8733d;
  --skin:#ffd8b5; --hat:#ffffff; --blush:#ff9aa2; --shirt0:#ff8a65; --shirt1:#7cc6f2; --shirt2:#9ad57a;
  --good:#1f8a52; --bad:#d23b3b; --gingham:#e2452f;
  --display:"Huninn","LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#21170f; --surface:#2d2118; --ink:#fbeedd; --muted:#d0b49a; --line:#4a3726;
  --tp:#5fcf85; --mp:#ff7a62; --ap:#78aaf5; --cheese:#ffcf55; --crust:#e6a75c; --sauce:#e85a43;
  --wall:#22352f; --tile:#2c4640; --floor:#4a3a26; --counter:#8a5630;
  --skin:#f3caa4; --hat:#f4f1ec; --blush:#ff8e98; --shirt0:#ff8a65; --shirt1:#5fb3e6; --shirt2:#84c766;
  --good:#4cc485; --bad:#f07070; --gingham:#c9442f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#21170f; --surface:#2d2118; --ink:#fbeedd; --muted:#d0b49a; --line:#4a3726;
  --tp:#5fcf85; --mp:#ff7a62; --ap:#78aaf5; --cheese:#ffcf55; --crust:#e6a75c; --sauce:#e85a43;
  --wall:#22352f; --tile:#2c4640; --floor:#4a3a26; --counter:#8a5630;
  --skin:#f3caa4; --hat:#f4f1ec; --blush:#ff8e98; --shirt0:#ff8a65; --shirt1:#5fb3e6; --shirt2:#84c766;
  --good:#4cc485; --bad:#f07070; --gingham:#c9442f; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 16px}
.cloth{height:10px;margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--gingham) 70%,transparent) 0 14px,transparent 14px 28px),
             repeating-linear-gradient(0deg,color-mix(in srgb,var(--gingham) 45%,transparent) 0 5px,transparent 5px 10px),var(--surface)}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-top:8px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:48px;height:48px;flex:none;animation:wob 3.5s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-8deg) translateY(-2px)}}
.top h1{font-family:var(--display);font-size:28px;margin:0;line-height:1.1;font-weight:400;white-space:nowrap}
.top h1 span{color:var(--mp)}
.top p{margin:0;color:var(--muted);font-size:13px}
nav.tabs{display:flex;flex-wrap:wrap;gap:8px}
nav.tabs button{font-family:var(--display);font-size:18px;padding:5px 14px 5px 7px;border-radius:999px;border:3px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--ink);transition:transform .1s,box-shadow .1s;touch-action:manipulation}
nav.tabs button b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--cheese);color:#3b2417;font-size:15px}
nav.tabs button[aria-selected="true"]{background:var(--mp);color:#fff;transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

.view{min-height:0}
.stage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:stretch}
.panel{background:var(--surface);border:3px solid var(--line);border-radius:22px;padding:12px 16px;min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px}
.chartbox{position:relative;min-height:260px}
.chartbox>svg{position:absolute;inset:0;width:100%;height:100%}
#kitchen{width:100%;height:auto;display:block;border-radius:16px;cursor:pointer;touch-action:manipulation;flex:none}
/* fit everything into one landscape screen (iPad ~1180×740); smaller screens fall back to normal scrolling */
@media (min-width:900px) and (min-height:560px){
  body{height:100dvh;overflow:hidden;padding-block:0}
  .wrap{height:calc(100dvh - 10px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding-bottom:12px}
  .view{flex:1 1 0}
  .stage{height:100%}
  .panel{overflow:auto}
  .chartbox{flex:1 1 0;min-height:0}
  #quiz{display:flex;flex-direction:column;gap:10px}
  #quiz .stage{flex:1 1 0;height:auto;min-height:0}
}
@media (max-width:899px){.stage{grid-template-columns:minmax(0,1fr)}}

h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;line-height:1.25;text-wrap:balance}
h3{font-family:var(--display);font-weight:400;font-size:19px;margin:0}
button{cursor:pointer}
.btn{font-family:var(--display);font-size:19px;padding:7px 18px;border-radius:16px;border:3px solid var(--ink);background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s;touch-action:manipulation}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--mp);color:#fff}
.btn.small{font-size:16px;padding:4px 12px;border-radius:13px;box-shadow:0 3px 0 var(--ink)}
.btn.on{background:var(--cheese);color:#3b2417}
.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--ap);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.note{font-size:14px;color:var(--muted);margin:0}
.ok{color:var(--good)} .no{color:var(--bad)}

.say{display:flex;gap:8px;align-items:flex-start}
.say>svg{width:48px;height:48px;flex:none}
.bubble{position:relative;flex:1;min-width:0;background:var(--cheese);color:#3b2417;border-radius:18px;padding:9px 14px;font-family:var(--display);font-size:19px;line-height:1.55}
.bubble::before{content:"";position:absolute;left:-11px;top:14px;border:7px solid transparent;border-right:12px solid var(--cheese);border-left:0}
.bubble b{font-weight:400}
.bubble b.mp{color:#c8321d} .bubble b.ap{color:#1f55aa} .bubble b.tp{color:#1d6e3a}
.bubble .ok{color:#17703f}
.bubble.pop{animation:bub .35s ease-out}
@keyframes bub{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}

table.dt{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:19px;width:100%;border:2px solid var(--line);border-radius:12px;overflow:hidden}
table.dt th,table.dt td{border-bottom:1px solid var(--line);padding:1px 8px;text-align:center}
table.dt th{background:var(--bg);font-size:15px;white-space:nowrap;font-weight:700}
table.dt th.mp,table.dt td.mp{color:var(--mp)} table.dt th.ap,table.dt td.ap{color:var(--ap)} table.dt th.tp,table.dt td.tp{color:var(--tp)}
table.dt tr.cur td{background:color-mix(in srgb,var(--cheese) 40%,var(--surface));font-weight:900}
.tblwrap{overflow-x:auto;flex:none}

svg.chart{display:block;touch-action:none;user-select:none}
svg.chart text{fill:var(--ink);font-family:var(--body);font-size:17px}
svg.chart text.muted{fill:var(--muted)}
svg.chart .axis{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
svg.chart .grid{stroke:var(--line);stroke-width:1.5;stroke-dasharray:2 6;stroke-linecap:round}
svg.chart .tp{stroke:var(--tp);stroke-width:5;fill:none;stroke-linecap:round}
svg.chart .tpsoft{stroke:var(--muted);stroke-opacity:.38;stroke-width:12;fill:none;stroke-linecap:round}
svg.chart .mpl{stroke:var(--mp);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.chart .apl{stroke:var(--ap);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.chart .tan{stroke:var(--mp);stroke-width:7;fill:none;stroke-linecap:round}
svg.chart .ray{stroke:var(--ap);stroke-width:4.5;fill:none;stroke-linecap:round;stroke-dasharray:12 9}
svg.chart .otan{stroke:var(--ink);stroke-opacity:.55;stroke-width:2.5;stroke-dasharray:2 7;stroke-linecap:round;fill:none}
svg.chart .guide{stroke:var(--muted);stroke-width:1.8;stroke-dasharray:6 6;fill:none}
svg.chart .now{stroke:var(--cheese);stroke-width:4;stroke-dasharray:9 6}
svg.chart .kp{fill:var(--surface);stroke:var(--ink);stroke-width:2.5}
svg.chart .t-mp{fill:var(--mp);font-weight:700} svg.chart .t-ap{fill:var(--ap);font-weight:700} svg.chart .t-tp{fill:var(--tp);font-weight:700}
svg.chart .trimp{fill:color-mix(in srgb,var(--mp) 16%,transparent);stroke:var(--mp);stroke-width:1.5;stroke-dasharray:4 3}
svg.chart .triap{fill:color-mix(in srgb,var(--ap) 12%,transparent);stroke:var(--ap);stroke-width:1.5;stroke-dasharray:4 3}
svg.chart .bar{fill:color-mix(in srgb,var(--mp) 30%,var(--surface));stroke:var(--mp);stroke-width:2}
svg.chart .dotmp{fill:var(--mp);stroke:var(--surface);stroke-width:3}
svg.chart .dotap{fill:var(--ap);stroke:var(--surface);stroke-width:3}
svg.chart .band1{fill:color-mix(in srgb,var(--ap) 12%,transparent)}
svg.chart .band2{fill:color-mix(in srgb,var(--tp) 16%,transparent)}
svg.chart .band3{fill:color-mix(in srgb,var(--mp) 12%,transparent)}
svg.chart .tmark{fill:var(--cheese);stroke:var(--ink);stroke-width:4}
svg.chart .tmarkIn{fill:var(--ink)}
svg.chart .ttag{fill:var(--surface);stroke:var(--ink);stroke-width:2}
svg.chart .ttagT{font-family:var(--display);font-size:19px}
svg .crust{fill:var(--crust)} svg .cheese{fill:var(--cheese)} svg .pep{fill:var(--sauce)}
svg .face{fill:#3b2417} svg .faceS{stroke:#3b2417;stroke-width:2.6;fill:none;stroke-linecap:round}
svg .blush{fill:var(--blush);opacity:.75}

#kitchen .wall{fill:var(--wall)} #kitchen .tileL{stroke:var(--tile);stroke-width:2}
#kitchen .floor{fill:var(--floor)} #kitchen .counter{fill:var(--counter)}
#kitchen .oven{fill:#9aa3ad} #kitchen .ovenD{fill:#5b636c} #kitchen .fire{fill:#ffb02e}
#kitchen .skin{fill:var(--skin)} #kitchen .hat{fill:var(--hat);stroke:#e6ddd0;stroke-width:1.5}
#kitchen .apron{fill:#ffffff;opacity:.92}
#kitchen .s0{fill:var(--shirt0)} #kitchen .s1{fill:var(--shirt1)} #kitchen .s2{fill:var(--shirt2)}
#kitchen .sweat{fill:#7cc6f2}
#kitchen .lbl{font-family:var(--display);font-size:20px;fill:#3b2417}
#kitchen .lblW{font-family:var(--display);font-size:19px;fill:var(--ink)}
#kitchen .big{font-family:var(--display);font-size:32px;fill:var(--ink)}
#kitchen .ghostP{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:4 4}
#kitchen .float{font-family:var(--display);font-size:32px}
#kitchen .tag{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.chef.pop{animation:popin .55s cubic-bezier(.3,1.6,.5,1) both}
.chef.shake{animation:jostle .5s ease-in-out infinite alternate}
.pz.pop{animation:popin .4s cubic-bezier(.3,1.6,.5,1) both}
.float{animation:rise .7s ease-out both}
@keyframes popin{0%{transform:scale(.2) translateY(30px)}100%{transform:scale(1) translateY(0)}}
@keyframes jostle{0%{transform:translateX(-3px) rotate(-3deg)}100%{transform:translateX(3px) rotate(3deg)}}
@keyframes rise{0%{transform:translateY(24px)}100%{transform:translateY(0)}}

/* view switch on the slope lab */
.viewseg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.viewseg button{font-family:var(--display);font-size:19px;padding:8px 6px;border-radius:16px;border:3px solid var(--ink);background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--ink);touch-action:manipulation;display:flex;align-items:center;justify-content:center;gap:6px}
.viewseg button i{width:24px;height:0;border-top:5px solid var(--c);border-radius:3px;display:inline-block}
.viewseg button i.dash{border-top-style:dashed}
.viewseg button[aria-pressed="true"]{background:var(--cheese);color:#3b2417;transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

.read{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.read>div{background:var(--bg);border-radius:14px;padding:3px 12px;border:3px solid var(--c,var(--line));transition:opacity .2s}
.read>div.off{opacity:.25}
.read .k{font-size:14px;color:var(--muted)}
.read .v{font-family:var(--display);font-size:30px;line-height:1.15;font-variant-numeric:tabular-nums}
.verdict{border-radius:16px;padding:8px 14px;border:4px solid var(--c,var(--line));font-family:var(--display);font-size:21px;line-height:1.45;background:var(--surface)}
.verdict b{font-weight:400}
.states{display:flex;flex-direction:column;gap:2px;font-size:18px}
.states div{display:flex;gap:10px;align-items:baseline}
.states b{min-width:3em;font-family:var(--display);font-weight:400;font-size:21px}
.stepper{display:flex;gap:10px;align-items:center;flex:none}
.stepper button{font-family:var(--display);font-size:22px;width:58px;height:46px;border-radius:14px;border:3px solid var(--ink);background:var(--surface);color:var(--ink);box-shadow:0 3px 0 var(--ink);touch-action:manipulation;flex:none}
.stepper button:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
input[type=range]{flex:1;min-width:0;accent-color:var(--mp);height:30px}
label.chk{display:flex;gap:8px;align-items:center;font-size:16px;cursor:pointer}
label.chk input{width:22px;height:22px;accent-color:var(--mp)}
.seg{display:flex;flex-wrap:wrap;gap:8px}

/* compact, optional scoreboard */
.board{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:3px solid var(--line);border-radius:18px;padding:6px 10px;flex:none}
.team{display:flex;align-items:center;gap:4px;border:2px solid var(--line);border-radius:14px;padding:2px 4px 2px 8px;cursor:pointer;background:var(--bg)}
.team.on{border-color:var(--mp);box-shadow:0 2px 0 var(--mp)}
.team .nm{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
.team .nm i{width:12px;height:12px;border-radius:50%;background:var(--tc)}
.team.on .nm{color:var(--ink);font-weight:700}
.team .pt{font-family:var(--display);font-size:24px;min-width:1.2em;text-align:center;font-variant-numeric:tabular-nums}
.team button{width:28px;height:30px;padding:0;font-size:17px;border-radius:9px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.boardctl{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin-left:auto}
.boardctl select{font:inherit;padding:2px 4px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.qtext{font-family:var(--display);font-size:26px;line-height:1.4}
.qtext b{font-weight:400}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.opt{position:relative;font-family:var(--display);font-size:21px;padding:11px 14px;border-radius:16px;border:3px solid var(--line);background:var(--bg);color:var(--ink);text-align:left;box-shadow:0 4px 0 var(--line);touch-action:manipulation}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--surface));box-shadow:0 4px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface));box-shadow:0 4px 0 var(--bad)}
.mini{position:absolute;right:10px;top:-14px;background:var(--good);color:#fff;font-family:var(--display);font-size:18px;padding:1px 10px;border-radius:999px;animation:mini .9s ease-out both;pointer-events:none}
@keyframes mini{0%{transform:translateY(10px) scale(.6);opacity:0}30%{transform:translateY(-4px) scale(1.1);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
.turn{font-size:16px;color:var(--muted)} .turn b{color:var(--ink);font-size:22px;font-family:var(--display);font-weight:400}
@media (prefers-reduced-motion:reduce){.brand svg,.chef.pop,.chef.shake,.pz.pop,.float,.bubble.pop,.mini{animation:none}}
</style>

<div class="cloth" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 80 80" aria-hidden="true" class="mascotBig"></svg>
      <div>
        <h1>小樂披薩店<span>產量實驗室</span></h1>
        <p>經濟學 4-4 短期產量分析｜烤箱固定，只增加員工</p>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="shop" aria-selected="true"><b>1</b>披薩廚房</button>
      <button role="tab" data-tab="slope"><b>2</b>斜率實驗室</button>
      <button role="tab" data-tab="compare"><b>3</b>三線對照</button>
      <button role="tab" data-tab="quiz"><b>4</b>搶答</button>
    </nav>
  </header>

  <!-- 1 kitchen -->
  <section class="view stage" id="shop">
    <div class="panel">
      <svg id="kitchen" role="img" aria-label="披薩店廚房：員工與做出的披薩"></svg>
      <div class="row between">
        <h2>每多請一位，多幾個披薩？</h2>
        <label class="chk"><input type="checkbox" id="shLine">畫出 MP 線</label>
      </div>
      <div class="chartbox"><svg class="chart" id="shopChart" aria-label="各員工的邊際產量與平均產量"></svg></div>
    </div>
    <div class="panel">
      <div class="row">
        <button class="btn primary" id="shNext">請第 1 位上工！</button>
        <button class="btn small" id="shBack">上一步</button>
        <button class="btn small" id="shReset">重新開始</button>
      </div>
      <div class="say"><svg viewBox="0 0 80 80" aria-hidden="true" class="mascot"></svg><div class="bubble" id="shMsg"></div></div>
      <div class="tblwrap">
        <table class="dt" id="shTable">
          <thead><tr><th>員工 L</th><th class="tp">總產量 TP</th><th class="mp">MP＝ΔTP/ΔL</th><th class="ap">AP＝TP/L</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <p class="note">數據：課本表 4-2。紅框長條＝MP，藍點連線＝AP；也可以直接點廚房圖請下一位。</p>
    </div>
  </section>

  <!-- 2 slope lab -->
  <section class="view stage" id="slope" hidden>
    <div class="panel">
      <h2 id="slHead"></h2>
      <div class="chartbox" style="flex-grow:2.3"><svg class="chart" id="slChart" aria-label="總產量曲線與切線、原點連線"></svg></div>
      <div class="stepper">
        <button id="slPrev" aria-label="往左一點">◀</button>
        <input type="range" id="slRange" min="0.2" max="7.5" step="0.05" value="2" aria-label="勞動投入量 L">
        <button id="slNextB" aria-label="往右一點">▶</button>
      </div>
      <div class="chartbox" id="slTrailBox"><svg class="chart" id="slTrail" aria-label="MP 與 AP 軌跡"></svg></div>
    </div>
    <div class="panel">
      <div class="viewseg" id="slView" role="group" aria-label="要看哪一條線">
        <button data-v="ap" aria-pressed="true"><i class="dash" style="--c:var(--ap)"></i>只看 AP</button>
        <button data-v="mp" aria-pressed="false"><i style="--c:var(--mp)"></i>只看 MP</button>
        <button data-v="both" aria-pressed="false">一起比較</button>
      </div>
      <div class="read">

    else if(L<KB){v.innerHTML="往右拖，藍色虛線越來越陡<br>→ AP 正在上升";s="AP ＝ 高 ÷ 底 ＝ TP ÷ L。還沒到 B 點以前，虛線一直變陡，所以 AP 上升。"}

 ["AP 達到最高點時，TP 也同時達到最高點。",false,"AP 最高在 B 點，TP 最高在更右邊的 C 點（MP＝0）。"],
 ["MP ＝ 0 時，TP 達到最大。",true,"再多一人也不會多做披薩，TP 停在最高點 C。"],
 ["AP 是 TP 線上某一點的切線斜率。",false,"AP 是該點與原點連線的斜率；切線斜率是 MP。"],
 ["MP 是 TP 線上某一點的切線斜率。",true,"MP ＝ ΔTP/ΔL，就是 TP 線在該點的切線斜率。"],
 ["三條線中，MP 最先到達最高點，AP 次之，TP 最後。",true,"MP 最高在 A′（L=3），AP 最高在 B′（L=4.5），TP 最高在 C（L=6）。"],
 ["TP 線的反曲點，對應 MP 線的最高點。",true,"反曲點 A 的切線最陡，所以 MP 在 A′ 最高。"],
 ["MP < 0 時，TP 減少。",true,"多一個人反而少做披薩，人多手雜，TP 下降。"],
 ["在 B 點，原點連線剛好也是 TP 線的切線。",true,"所以 B 點的 MP ＝ AP（課本第 138 頁註 4）。"],
 ["AP 下降時，TP 一定也在下降。",false,"B 到 C 之間 AP 下降，但 TP 仍在增加。"]
];
const GL=[1,1.5,2,2.5,3.5,4,5,5.5,6.5,7];
const SHOPS=[["小新","烤地瓜"],["風間","飯糰"],["妮妮","蛋糕"],["正男","雞蛋糕"],["阿呆","章魚燒"],["美冴","便當"],["廣志","拉麵"]];
const Q={cur:null,kind:"mix",done:false};
function qGraph(){
  const bonus=Math.random()<.15;
  const L=bonus?KB:pick(GL);
  const m=MP(L),a=AP(L);
  const ty=pick(bonus?["rel","ap"]:["slope","rel","ap","mp"]);
  let text,opts,ans,ex;
  const rel=near(m,a,.1)?2:(m>a?0:1);
  if(ty==="slope"){text="在標示的這一點，切線斜率和原點連線斜率，哪一個比較大？";opts=["切線斜率較大","原點連線斜率較大","一樣大"];ans=rel;
    ex=`切線斜率＝MP＝${f1(m)}，原點連線斜率＝AP＝${f1(a)}。`}
  else if(ty==="rel"){text="在標示的這一點，MP 和 AP 的關係是？";opts=["MP > AP","MP < AP","MP ＝ AP"];ans=rel;
    ex=`看圖：${rel===0?"紅色切線較陡":rel===1?"藍色連線較陡":"兩線重合"}，MP＝${f1(m)}、AP＝${f1(a)}。`}
  else if(ty==="ap"){text="在標示的這一點，AP 正在？";opts=["上升","下降","在最高點"];ans=rel===2?2:rel===0?0:1;
    ex=rel===2?"原點連線剛好是切線，MP＝AP，AP 在最高點。":rel===0?`這一點在 B 點以前，MP（${f1(m)}）> AP（${f1(a)}），AP 被拉高。`:`這一點在 B 點以後，MP（${f1(m)}）< AP（${f1(a)}），AP 被拉低。`}
  else{text="在標示的這一點，MP 正在？";opts=["遞增","遞減，但大於 0","遞減，且小於 0"];ans=L<KA?0:L<KC?1:2;
    ex=ans===0?"在反曲點 A 以前，TP 凹向上，MP 遞增。":ans===1?"在 A 到 C 之間，TP 凹向下但仍上升，MP 遞減但為正。":"過了 C 點 TP 下降，MP 為負。"}
  return {kind:"graph",text,opts,ans,ex,L};
}
function qTF(){const [s,t,ex]=pick(TF);return {kind:"tf",text:"是非題："+s,opts:["○ 對","✕ 錯"],ans:t?0:1,ex}}
function qCalc(){
  const [who,item]=pick(SHOPS);
  const m1=rnd(2,5),m2=m1+rnd(2,5),m3=m2+rnd(1,3);const mp=[m1,m2,m3];let v=m3;while(mp.length<6){v-=rnd(2,4);mp.push(v)}
  const tp=[0];mp.forEach((x,i)=>tp.push(tp[i]+x));
  const k=rnd(2,6),isMP=Math.random()<.5;
  const right=isMP?mp[k-1]:Math.round(tp[k]/k*10)/10;
  const cand=isMP?[tp[k],Math.round(tp[k]/k*10)/10,tp[k-1],mp[k-1]+rnd(1,2),mp[k-1]-rnd(1,2),tp[k]+tp[k-1]]
                 :[mp[k-1],Math.round(tp[k-1]/k*10)/10,Math.round(tp[k]/(k-1)*10)/10,tp[k],Math.round((tp[k]/k+1)*10)/10];
  const set=[right];cand.forEach(c=>{if(set.length<4&&!set.includes(c))set.push(c)});
  while(set.length<4){const c=right+set.length*2;if(!set.includes(c))set.push(c)}
  set.sort((a,b)=>a-b);
  const text=`${who}的${item}店（設備固定），請問 L ＝ ${k} 時的 <b style="color:var(--${isMP?"mp":"ap"})">${isMP?"邊際產量 MP":"平均產量 AP"}</b> 是多少？${isMP?"":"（四捨五入到小數第一位）"}`;
  const ex=isMP?`MP ＝ ΔTP/ΔL ＝ (${tp[k]} − ${tp[k-1]}) ÷ (${k} − ${k-1}) ＝ ${right}`:`AP ＝ TP/L ＝ ${tp[k]} ÷ ${k} ＝ ${f1(right)}`;
  return {kind:"calc",text,opts:set.map(f1),ans:set.indexOf(right),ex,tp,mp,k,isMP,item};
}
function newQ(){
  const k=Q.kind==="mix"?pick(["graph","graph","tf","calc"]):Q.kind;
  Q.cur=k==="graph"?qGraph():k==="tf"?qTF():qCalc();Q.done=false;renderQ();
}
function renderQ(){
  const q=Q.cur;renderBoard();
  $("#qText").innerHTML=q.text;
  const o=$("#qOpts");o.innerHTML="";
  q.opts.forEach((t,i)=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>answer(i);o.appendChild(b)});
  $("#qExplainWrap").hidden=true;
  renderSide();
}
function renderSide(){
  const q=Q.cur,side=$("#qSide");side.innerHTML="";
  if(q.kind==="graph"){
    const box=document.createElement("div");box.className="chartbox";side.appendChild(box);
    const svg=document.createElementNS(NS,"svg");svg.setAttribute("class","chart");box.appendChild(svg);
    const c=chart(svg,{W:560,H:430,x0:0,x1:LMAX,y0:0,y1:42,xt:[1,2,3,4,5,6,7],yt:[0,10,20,30,40],xl:"L",yl:"TP",pad:{t:18,b:46}});
    curve(c,TP,0,LMAX,"tpsoft");
    /* reference marks students judge against: inflection point A, origin tangent touching at B, TP max C */
    seg(c,0,0,6.1,AP(KB)*6.1,"otan");
    el("text",{x:c.X(5.2),y:c.Y(AP(KB)*5.6)-6,"text-anchor":"end",class:"muted",style:"font-weight:700"},c.top,"從原點對 TP 的切線");
    [[KA,"A 反曲點",1],[KB,"B",1],[KC,"C TP最高",0]].forEach(([k,n,left])=>{
      el("circle",{cx:c.X(k),cy:c.Y(TP(k)),r:7,class:"kp"},c.top);
      el("text",{x:c.X(k)+(left?14:0),y:c.Y(TP(k))+(left?6:-16),"text-anchor":left?"start":"middle",style:"font-weight:700"},c.top,n);
    });
    const L=q.L,t=TP(L),m=MP(L),a=AP(L);
    if(Q.done){seg(c,0,0,L,t,"ray");tanSeg(c,L);
      el("text",{x:c.X(.3),y:c.p.t+24,class:"t-mp"},c.top,"切線斜率 MP＝"+f1(m));
      el("text",{x:c.X(.3),y:c.p.t+50,class:"t-ap"},c.top,"連線斜率 AP＝"+f1(a));}
    tangentMark(c,L,"這一點");
    side.insertAdjacentHTML("beforeend",`<p class="note">A 點（反曲點）：MP 最高。B 點（原點切線切到的點）：AP 最高、MP＝AP。C 點：TP 最高、MP＝0。看這一點在哪一段。</p>`);
  } else if(q.kind==="calc"){
    const n=q.tp.length-1;let h=`<h3>${q.item}產量表</h3><div class="tblwrap"><table class="dt"><thead><tr><th>L</th><th class="tp">TP</th><th class="mp">MP</th><th class="ap">AP</th></tr></thead><tbody>`;
    for(let L=1;L<=n;L++){
      const isQ=L===q.k;
      const mpc=Q.done?q.mp[L-1]:(isQ&&q.isMP?"?":"");
      const apc=Q.done?f1(q.tp[L]/L):(isQ&&!q.isMP?"?":"");
      h+=`<tr class="${isQ?"cur":""}"><td>${L}</td><td class="tp">${q.tp[L]}</td><td class="mp">${mpc}</td><td class="ap">${apc}</td></tr>`;
    }
    side.innerHTML=h+"</tbody></table></div>";
  } else {
    side.innerHTML=`<h3>判斷口訣</h3><div class="states"><div><b style="color:var(--mp)">MP</b><span>切線斜率，三條線中最先到達最高點（A′）</span></div><div><b style="color:var(--ap)">AP</b><span>原點連線斜率，MP 穿過它的最高點（B′）</span></div><div><b style="color:var(--tp)">TP</b><span>MP＝0 時最高（C），三條線中最後到達最高點</span></div><div><b>平均</b><span>MP > AP，AP 上升；MP < AP，AP 下降</span></div></div>`;
  }
}
function answer(i){
  if(Q.done)return;Q.done=true;const q=Q.cur,ok=i===q.ans;
  if(ok&&S.on){S.scores[S.cur]++;save()}
  const btns=$$("#qOpts .opt");
  btns.forEach((b,j)=>{if(j===q.ans)b.classList.add("right");else if(j===i)b.classList.add("wrong")});
  if(ok){const p=document.createElement("span");p.className="mini";p.textContent=S.on?"+1":"答對！";btns[i].appendChild(p)}
  $("#qExplainWrap").hidden=false;mascotMood($("#qMascot"),ok?"happy":"sad");
  $("#qExplain").innerHTML=(ok?`<b class="ok">答對了！${S.on?`第 ${S.cur+1} 組 +1 分`:""}</b>`:`<b style="color:#c8321d">可惜～正確答案是「${q.opts[q.ans]}」</b>`)+"<br>"+q.ex;
  renderBoard();renderSide();
}
$("#qNext").onclick=()=>{if(S.on){S.cur=(S.cur+1)%S.n;save()}newQ()};
$("#qSkip").onclick=newQ;
$$("#qKind button").forEach(b=>b.onclick=()=>{Q.kind=b.dataset.k;$$("#qKind button").forEach(x=>x.classList.toggle("on",x===b));newQ()});

/* keyboard still works on a computer */
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,select,textarea"))return;
  if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft")return;
  const dir=e.key==="ArrowRight"?1:-1,size=e.shiftKey?.5:.05;
  if(tab==="shop")dir>0?shNext():shBack();
  else if(tab==="slope"){stopPlay();slSet(sl.L+dir*size)}
  else if(tab==="compare"){stopPlay();cpSet(cp.L+dir*size)}
  else return;
  e.preventDefault();
});

setMascots();
const h=(location.hash||"").slice(1);
show(TABS.includes(h)?h:"shop");
})();
</script>
