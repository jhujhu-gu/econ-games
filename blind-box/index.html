<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>需求概念極速二選一</title>
  <!-- MathJax 支援經濟學公式與符號排版 -->
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --accent: #f59e0b;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 100%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px 16px 80px 16px;
    }

    /* 頂部標題區 */
    header {
      text-align: center;
      margin-bottom: 20px;
    }

    .game-badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid #818cf8;
      color: #c7d2fe;
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 2.2rem;
      background: linear-gradient(135deg, #a5b4fc 0%, #f472b6 50%, #facc15 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .header-desc {
      color: var(--text-muted);
      font-size: 1.05rem;
      font-weight: 600;
    }

    /* 控制面板 */
    .control-panel {
      max-width: 1200px;
      margin: 0 auto 20px auto;
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 14px 18px;
      border-radius: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .filter-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .filter-btn.active {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white;
      border-color: #818cf8;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }

    .lottery-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 6px 14px;
      border-radius: 12px;
    }

    .lottery-box input {
      width: 48px;
      padding: 6px;
      text-align: center;
      background: #1e293b;
      border: 1px solid #f59e0b;
      border-radius: 6px;
      color: #fef08a;
      font-weight: 800;
      font-size: 1rem;
    }

    .lottery-btn {
      background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.35);
    }

    .reset-btn {
      background: rgba(255, 255, 255, 0.1);
      color: #94a3b8;
    }

    /* 題庫網格 */
    .card-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }

    /* 盲盒外觀 */
    .box-card {
      position: relative;
      height: 200px;
      background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow: hidden;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25);
    }

    .box-card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: #818cf8;
      box-shadow: 0 12px 24px rgba(99, 102, 241, 0.3);
    }

    .box-icon {
      font-size: 3.5rem;
      margin-bottom: 6px;
      filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.4));
      transition: transform 0.3s ease;
    }

    .box-card:hover .box-icon {
      transform: scale(1.1) rotate(6deg);
    }

    .box-number {
      font-size: 1.05rem;
      font-weight: 900;
      color: #f8fafc;
    }

    /* 分數徽章 */
    .score-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .score-1 {
      background: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.5);
    }

    .score-2 {
      background: rgba(245, 158, 11, 0.2);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.5);
    }

    .score-3 {
      background: rgba(236, 72, 153, 0.2);
      color: #f472b6;
      border: 1px solid rgba(236, 72, 153, 0.5);
    }

    .box-tag {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 999px;
      margin-top: 6px;
      font-weight: 600;
    }

    .tag-part1 {
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.4);
    }

    .tag-part2 {
      background: rgba(236, 72, 153, 0.2);
      color: #f472b6;
      border: 1px solid rgba(236, 72, 153, 0.4);
    }

    .box-card.opened {
      opacity: 0.5;
      filter: grayscale(0.7);
      border-color: rgba(255, 255, 255, 0.05);
    }

    .box-card.opened::after {
      content: "✓ 已解答";
      position: absolute;
      bottom: 8px;
      font-size: 0.75rem;
      background: #10b981;
      color: white;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
    }

    /* 滿版超大卡片視窗 */
    .fullscreen-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(14px);
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .fullscreen-modal.active {
      display: flex;
      opacity: 1;
    }

    .modal-card {
      background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
      border: 3px solid #6366f1;
      box-shadow: 0 25px 60px -10px rgba(99, 102, 241, 0.5);
      border-radius: 24px;
      width: 100%;
      max-width: 960px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 36px 40px;
      display: flex;
      flex-direction: column;
      animation: modalZoomIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes modalZoomIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .modal-category {
      font-size: 1.15rem;
      font-weight: 800;
      color: #818cf8;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .modal-score-badge {
      font-size: 0.95rem;
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .close-restore-btn {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 8px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .close-restore-btn:hover {
      background: #ef4444;
      color: white;
    }

    .modal-question {
      font-size: 1.65rem;
      line-height: 1.6;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 24px;
    }

    .options-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 24px;
    }

    .option-card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 18px 20px;
      font-size: 1.25rem;
      font-weight: 700;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .option-letter {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 900;
      flex-shrink: 0;
    }

    .modal-answer-box {
      display: none;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(5, 150, 105, 0.15) 100%);
      border: 2px solid #10b981;
      border-radius: 18px;
      padding: 22px 26px;
      margin-top: 10px;
      animation: fadeIn 0.3s ease-out;
    }

    .modal-answer-box.show {
      display: block;
    }

    .ans-header {
      font-size: 1.1rem;
      font-weight: 800;
      color: #34d399;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .score-congrats {
      background: #10b981;
      color: #ffffff;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 800;
    }

    .ans-main {
      font-size: 1.8rem;
      font-weight: 900;
      color: #6ee7b7;
      margin-bottom: 12px;
    }

    .ans-analysis {
      font-size: 1.2rem;
      line-height: 1.65;
      color: #ecfdf5;
      background: rgba(0, 0, 0, 0.25);
      padding: 14px 18px;
      border-radius: 12px;
      border-left: 4px solid #10b981;
    }

    .bottom-actions {
      display: flex;
      gap: 14px;
      margin-top: 24px;
    }

    .btn-reveal {
      flex: 2;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      font-size: 1.15rem;
      padding: 14px;
      justify-content: center;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
    }

    .btn-close-modal {
      flex: 1;
      background: rgba(255, 255, 255, 0.12);
      color: #f1f5f9;
      font-size: 1.15rem;
      padding: 14px;
      justify-content: center;
      border-radius: 14px;
    }

    /* 抽籤彈窗 */
    .gacha-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      z-index: 10001;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .gacha-modal.active {
      display: flex;
    }

    .gacha-card {
      background: #1e293b;
      border: 3px solid #f59e0b;
      box-shadow: 0 0 50px rgba(245, 158, 11, 0.4);
      border-radius: 28px;
      padding: 40px 48px;
      text-align: center;
      max-width: 480px;
      width: 90%;
      animation: modalZoomIn 0.3s ease;
    }

    .gacha-sphere {
      font-size: 5rem;
      margin-bottom: 12px;
      display: inline-block;
      animation: spinBounce 0.8s ease infinite alternate;
    }

    @keyframes spinBounce {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-16px) rotate(15deg); }
    }

    .gacha-student {
      font-size: 3.2rem;
      font-weight: 900;
      color: #fbbf24;
      line-height: 1.1;
      text-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
    }

    .gacha-text {
      font-size: 1.3rem;
      color: #e2e8f0;
      font-weight: 700;
      margin: 12px 0 24px 0;
    }

    .gacha-go-btn {
      background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
      font-size: 1.25rem;
      padding: 14px 28px;
      border-radius: 14px;
      width: 100%;
      justify-content: center;
    }

    @media (max-width: 768px) {
      .modal-card { padding: 24px 20px; }
      .modal-question { font-size: 1.25rem; }
      .options-container { grid-template-columns: 1fr; gap: 10px; }
      .ans-main { font-size: 1.4rem; }
      .ans-analysis { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="game-badge">⚡ 經濟學翻牌挑戰 ⚡</div>
    <h1>需求概念極速二選一</h1>
    <div class="header-desc">抽號點名 ➔ 盲盒解鎖 ➔ 平時成績加分！</div>
  </header>

  <div class="control-panel">
    <div class="btn-group">
      <button class="filter-btn active" onclick="filterCategory('all', this)">🎁 全部盲盒 (35)</button>
      <button class="filter-btn" onclick="filterCategory('part1', this)">📦 需求 vs. 需求量 (20)</button>
      <button class="filter-btn" onclick="filterCategory('part2', this)">💎 需求彈性觀念 (15)</button>
    </div>

    <div class="lottery-box">
      <span style="font-weight: 700; color: #f59e0b;">座號範圍：</span>
      <input type="number" id="minSeat" value="1">
      <span style="color: #94a3b8;">~</span>
      <input type="number" id="maxSeat" value="45">
      <button class="lottery-btn" onclick="triggerGacha()">🎲 隨機點名抽籤！</button>
    </div>

    <div class="btn-group">
      <button class="reset-btn" onclick="resetAllBoxes()">🔄 重置所有盲盒</button>
    </div>
  </div>

  <main class="card-grid" id="cardGrid"></main>

  <!-- 滿版大螢幕深度解析卡片 -->
  <div class="fullscreen-modal" id="fullscreenModal">
    <div class="modal-card">
      <div class="modal-top-bar">
        <div class="modal-category" id="modalCategory">
          <span id="modalIcon" style="font-size: 1.6rem;">🎁</span>
          <span id="modalTitle">第 01 盒</span>
          <span class="modal-score-badge" id="modalScoreBadge">+1 分</span>
        </div>
        <button class="close-restore-btn" onclick="closeFullscreen()">✕ 結束講解 (復原)</button>
      </div>

      <div class="modal-question" id="modalQuestion"></div>
      <div class="options-container" id="modalOptions"></div>

      <div class="modal-answer-box" id="modalAnswerBox">
        <div class="ans-header">
          <span>🎯 標準解答：</span>
          <span class="score-congrats" id="modalScoreCongrats">🎉 答對平時成績 +1 分！</span>
        </div>
        <div class="ans-main" id="modalAnswer"></div>
        <div class="ans-analysis" id="modalTip"></div>
      </div>

      <div class="bottom-actions">
        <button class="btn-reveal" id="btnReveal" onclick="revealAnswer()">💡 公布答案與 1 秒解析</button>
        <button class="btn-close-modal" onclick="closeFullscreen()">返回題庫</button>
      </div>
    </div>
  </div>

  <!-- 抽籤彈窗 -->
  <div class="gacha-modal" id="gachaModal">
    <div class="gacha-card">
      <div class="gacha-sphere">🎯</div>
      <div class="gacha-student" id="gachaSeatDisplay">?? 號</div>
      <div class="gacha-text">幸運抽中！請同學挑選盲盒作答加分！</div>
      <button class="gacha-go-btn" onclick="closeGacha()">開始選盒 🚀</button>
    </div>
  </div>

  <script>
    const boxIcons = ["🎁", "📦", "🔮", "💎", "👾", "🤖", "🚀", "🪐", "⚡", "🎮", "🕹️", "🎪", "🏆", "🌟", "🔥", "🛸", "🎯", "🧩", "🎲", "🧸"];

    const cardsDatabase = [
      // ====== 第一部分：需求 vs. 需求量 (20題) ======
      {
        id: "p1-01",
        part: "part1",
        partName: "需求 vs. 需求量",
        label: "第 01 盒",
        points: 1,
        icon: boxIcons[0],
        q: "麥當勞推出「大薯買一送一」促銷，引發高職生排隊搶購。請問這屬於？",
        optA: "(A) 需求量變動",
        optB: "(B) 需求變動",
        a: "(A) 需求量變動",
        tip: "1 秒解析：買一送一等同於大薯「本身價格變便宜」，是價格引發同條線上的「點移動」！"
      },
      {
        id: "p1-02",
        part: "part1",
        partName: "需求 vs. 需求量",
        label: "第 02 盒",
        points: 2,
        icon: boxIcons[1],
        q: "預告下週汽油每公升調漲 2 元，民眾今晚紛紛前往加油站把油加滿。請問今晚的加油行為屬於？",
        optA: "(A) 需求量變動",
        optB: "(B) 需求變動",
        a: "(B) 需求變動",
        tip: "1 秒解析：今天是受「預期未來漲價」影響，汽油「今天本身價格未變」，屬於整條需求曲線向右平移！"
      },
      {
        id: "p1-03",
        part: "part1",
        partName: "需求 vs. 需求量",
        label: "第 03 盒",
        points: 1,
        icon: boxIcons[2],
        q: "新聞報導吃木瓜能提升免疫力，引發市場上的木瓜搶購熱潮。請問這屬於？",
        optA: "(A) 需求量變動",
        optB: "(B) 需求變動",
        a: "(B) 需求變動",
        tip: "1 秒解析：這是受「消費者偏好增強」影響，木瓜本身價格未變，整條需求曲線向右平移！"
      },
      {
        id: "p1-04",
        part: "part1",
        partName: "需求 vs. 需求量",
        label: "第 04 盒",
        points: 1,
        icon: boxIcons[3],
        q: "手搖飲店把珍奶從每杯 50 元調漲至 65 元，造成銷售量明顯減少。請問這屬於？",
        optA: "(A) 需求量變動",
        optB: "(B) 需求變動",
        a: "(A) 需求量變動",
        tip: "1 秒解析：珍奶「本身價格上漲」導致購買數量減少，屬於需求量變動！"
      },
      {
        id: "p1-05",
        part: "part1",
        partName: "需求 vs. 需求量",
        label: "第 05 盒",
        points: 2,
        icon: boxIcons[4],
        q: "阿誠打工獲得加薪 20%，於是決定每個月多吃幾次火鍋大餐。請問阿誠對火鍋的變動屬於？",
        optA: "(A) 需求量變動",
        optB: "(B) 需求變動",
        a: "(B) 需求變動",
        tip: "1 秒解析：變動原因是「所得增加」，而非火鍋本身降價，屬於整條需求線向右平移！"
      },
      {
        id: "p1-06",
        part: "part1",
        partName: "需求 vs. 需求量",
        label: "第 06 盒",
        points: 1,
        icon: boxIcons[5],
        q: "全聯超市舉辦週年慶，高麗菜特價一把 10 元引發婆婆媽媽搶購。請問這屬於？",
        optA: "(A) 需求量變動",
        optB: "(B) 需求變動",
        a: "(A) 需求量變動",
        tip: "1 秒解析：特價是高麗菜「本身價格下跌」，促使買量增加，屬需求量變動！"
      },
      {

          <div class="box-number">${card.label}</div>
          <div class="box-tag ${card.part === 'part1' ? 'tag-part1' : 'tag-part2'}">
            ${card.partName}
          </div>
        `;
        grid.appendChild(item);
      });
    }

    function openFullscreenCard(card) {
      currentActiveCard = card;

      document.getElementById('modalIcon').innerText = card.icon;
      document.getElementById('modalTitle').innerText = `${card.label} ｜ ${card.partName}`;
      
      const badge = document.getElementById('modalScoreBadge');
      badge.innerText = `+${card.points} 分 獎勵`;
      badge.className = `modal-score-badge score-${card.points}`;

      document.getElementById('modalQuestion').innerText = card.q;
      
      document.getElementById('modalOptions').innerHTML = `
        <div class="option-card">
          <div class="option-letter">A</div>
          <div>${card.optA.replace('(A) ', '')}</div>
        </div>
        <div class="option-card">
          <div class="option-letter">B</div>
          <div>${card.optB.replace('(B) ', '')}</div>
        </div>
      `;

      const ansBox = document.getElementById('modalAnswerBox');
      ansBox.classList.remove('show');
      document.getElementById('modalScoreCongrats').innerText = `🎉 答對平時成績 +${card.points} 分！`;
      document.getElementById('modalAnswer').innerText = card.a;
      document.getElementById('modalTip').innerText = card.tip;

      const btnRev = document.getElementById('btnReveal');
      btnRev.innerText = '💡 公布答案與 1 秒解析';
      btnRev.style.display = 'inline-flex';

      const modal = document.getElementById('fullscreenModal');
      modal.classList.add('active');

      if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([modal]);
      }
    }

    function revealAnswer() {
      const ansBox = document.getElementById('modalAnswerBox');
      ansBox.classList.add('show');
      document.getElementById('btnReveal').style.display = 'none';

      if (currentActiveCard) {
        const targetBox = document.getElementById(`box-${currentActiveCard.id}`);
        if (targetBox) {
          targetBox.classList.add('opened');
        }
      }

      if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([ansBox]);
      }
    }

    function closeFullscreen() {
      document.getElementById('fullscreenModal').classList.remove('active');
    }

    function triggerGacha() {
      const min = parseInt(document.getElementById('minSeat').value) || 1;
      const max = parseInt(document.getElementById('maxSeat').value) || 45;

      if (min > max) {
        alert("座號起始不能大於結束！");
        return;
      }

      const luckySeat = Math.floor(Math.random() * (max - min + 1)) + min;
      document.getElementById('gachaSeatDisplay').innerText = `第 ${luckySeat} 號`;
      document.getElementById('gachaModal').classList.add('active');
    }

    function closeGacha() {
      document.getElementById('gachaModal').classList.remove('active');
    }

    function filterCategory(category, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderBoxes(category);
    }

    function resetAllBoxes() {
      document.querySelectorAll('.box-card').forEach(b => b.classList.remove('opened'));
    }

    window.addEventListener('keydown', (e) => {
      const modal = document.getElementById('fullscreenModal');
      if (modal.classList.contains('active')) {
        if (e.key === 'Escape') closeFullscreen();
        if (e.key === ' ') {
          e.preventDefault();
          revealAnswer();
        }
      }
    });

    renderBoxes();
  </script>
</body>
</html>
